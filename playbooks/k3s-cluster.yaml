---
- name: K3s Cluster
  hosts: k3s
  become: true
  roles:
    - role: k3s
  vars:
    k3s_version: v1.30.2+k3s2
    extra_server_args: >
      --node-label "topology.kubernetes.io/zone={{ hostvars[inventory_hostname].vars.node_name }}"
    extra_agent_args: >
      --node-label "topology.kubernetes.io/zone={{ hostvars[inventory_hostname].vars.node_name }}"
