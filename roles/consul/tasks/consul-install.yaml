---
- name: Check current Consul installation
  ansible.builtin.command:
    cmd: consul --version
  register: current_consul_version
  ignore_errors: true
  changed_when: false

- name: Install Consul if not installed
  when: current_consul_version.failed or current_consul_version.stdout.find(consul_version) == -1
  block:
    - name: Add HashiCorp APT repository
      ansible.builtin.include_role:
        name: apt-repository
      vars:
        apt_repository_hashicorp: true

    - name: Install Consul
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      with_items:
        - consul={{ consul_version }}
