---
- name: Prepare Keepalived tracking script
  ansible.builtin.copy:
    src: files/vault-health.sh
    dest: /usr/local/bin/vault-health
    owner: root
    group: root
    mode: '0755'

- name: Install & configure Keepalived
  ansible.builtin.include_role:
    name: keepalived
  vars:
    keepalived_servers: "{{ vault_keepalived.servers }}"
    keepalived_master_server: "{{ vault_keepalived.master }}"
    keepalived_routers:
      - name: "{{ vault_keepalived.name }}"
        id: "{{ vault_keepalived.vr_id }}"
        ip: "{{ vault_keepalived.vr_ip }}"
        track_script:
          script: /usr/local/bin/vault-health
          interval: 3
